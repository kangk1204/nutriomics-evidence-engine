[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriomics-literature"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.34,<0.35", "streamlit>=1.49,<2", "plotly>=6,<7", "requests>=2.32,<3", "defusedxml>=0.7,<1", "supervisor>=4.2,<5", "psutil>=6,<8", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
nutri-literature = "nutri_literature.cli:main"

[tool.setuptools.packages.find]
include = ["nutri_literature*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
